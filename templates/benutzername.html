<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Familienplaner - Benutzername ändern</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="app-body">

    <div class="app-container">

        <header class="topbar">
            <div>
                <h1>Benutzername ändern</h1>
                <p>Familienplaner</p>
            </div>

            <a href="/admin" class="logout-button">
                Zurück
            </a>
        </header>


        <main class="dashboard">

            <div class="welcome-card">

                <h2>
                    Benutzername ändern
                </h2>

                <p>
                    Aktueller Benutzername:
                    <strong>
                        {{ benutzer["benutzername"] }}
                    </strong>
                </p>


                <form method="POST" class="admin-form">

                    <label>
                        Neuer Benutzername
                    </label>

                    <input
                        type="text"
                        name="benutzername"
                        value="{{ benutzer['benutzername'] }}"
                        required
                    >

                    <button type="submit">
                        Benutzernamen speichern
                    </button>

                </form>


                {% if meldung %}
                    <p class="meldung">
                        {{ meldung }}
                    </p>
                {% endif %}

            </div>

        </main>

    </div>

</body>
</html>
